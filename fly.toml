# Generated manually - review app name and primary_region before first deploy.
# `flyctl launch` can regenerate/adjust this interactively if you'd rather.

app = "schoolos-metocore"          # must be globally unique on Fly - change if taken
primary_region = "iad"             # pick the region closest to your pilot school

[build]

[env]
  DJANGO_DB_PATH = "/data/db.sqlite3"
  # DJANGO_DEBUG defaults to False (unset) - do not set this to True here.
  # Set DJANGO_ALLOWED_HOSTS, DJANGO_CSRF_TRUSTED_ORIGINS and DJANGO_SECRET_KEY
  # via `fly secrets set`, not here - this [env] block is plain text, not secret.

[[mounts]]
  source = "schoolos_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]
