{% extends "base.html" %}
{% block title %}Edit {{ period.name }} — Metocore{% endblock %}

{% block header_nav %}
<a href="{% url 'dashboard' %}">Dashboard</a>
<a href="{% url 'teacher-list' %}">Teachers</a>
<a href="{% url 'geofence-list' %}">Geofences</a>
<a href="{% url 'term-list' %}">Terms</a>
<a href="{% url 'announcement-list' %}">Announcements</a>
<a href="{% url 'event-list' %}">Events</a>
<a href="{% url 'attendance-report' %}">Reports</a>
<a href="{% url 'timetable-period-list' %}"><strong>Timetable</strong></a>
{% endblock %}

{% block content %}
<p><a href="{% url 'timetable-period-list' %}">&laquo; Periods</a></p>
<h1>Edit {{ period.name }}</h1>

<div class="card" style="max-width: 480px;">
    <form method="post">
        {% csrf_token %}
        <div class="field">
            <label>Day</label>
            <select name="day_of_week" required>
                {% for value, label in day_choices %}
                <option value="{{ value }}" {% if value == period.day_of_week %}selected{% endif %}>{{ label }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="field">
            <label>Period name</label>
            <input type="text" name="name" value="{{ period.name }}" required>
        </div>
        <div class="row">
            <div class="field" style="flex: 1;">
                <label>Start time</label>
                <input type="time" name="start_time" value="{{ period.start_time|time:'H:i' }}" required>
            </div>
            <div class="field" style="flex: 1;">
                <label>End time</label>
                <input type="time" name="end_time" value="{{ period.end_time|time:'H:i' }}" required>
            </div>
        </div>
        <div class="field">
            <label style="display: flex; align-items: center; gap: 0.5rem; font-weight: 500;">
                <input type="checkbox" name="is_teaching_period" {% if period.is_teaching_period %}checked{% endif %} style="width: auto;">
                This is a teaching period (uncheck for Break/Lunch)
            </label>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Save changes</button>
    </form>
</div>
{% endblock %}
