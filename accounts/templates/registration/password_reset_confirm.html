<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Set a new password</title>
</head>
<body>
    <h1>Set a new password</h1>
    {% if validlink %}
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Change password</button>
    </form>
    {% else %}
    <p>This password reset link is invalid, possibly because it has already been used. Request a new one.</p>
    {% endif %}
</body>
</html>
