<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Schools — Platform Admin</title>
</head>
<body>
    <h1>Schools</h1>

    {% if messages %}
    <ul>
        {% for message in messages %}<li>{{ message }}</li>{% endfor %}
    </ul>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        <input type="text" name="name" placeholder="School name" required>
        <button type="submit">Add school</button>
    </form>

    <ul>
        {% for school in schools %}
        <li><a href="{% url 'platform-school-detail' school.id %}">{{ school.name }}</a></li>
        {% empty %}
        <li>No schools yet.</li>
        {% endfor %}
    </ul>
</body>
</html>
