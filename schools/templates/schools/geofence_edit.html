{% extends "base.html" %}
{% block title %}Edit {{ geofence.name }} — SchoolOS{% endblock %}

{% block header_nav %}
<a href="{% url 'dashboard' %}">Dashboard</a>
<a href="{% url 'teacher-list' %}">Teachers</a>
<a href="{% url 'geofence-list' %}"><strong>Geofences</strong></a>
{% endblock %}

{% block content %}
<p><a href="{% url 'geofence-list' %}">&laquo; Geofences</a></p>
<h1>Edit {{ geofence.name }}</h1>

<div class="card" style="max-width: 480px;">
    <form method="post">
        {% csrf_token %}
        <div class="field">
            <label>Name</label>
            <input type="text" name="name" value="{{ geofence.name }}" required>
        </div>
        <div class="field">
            <label>Latitude</label>
            <input type="text" name="center_latitude" value="{{ geofence.center_latitude }}" required>
        </div>
        <div class="field">
            <label>Longitude</label>
            <input type="text" name="center_longitude" value="{{ geofence.center_longitude }}" required>
        </div>
        <div class="field">
            <label>Radius (meters)</label>
            <input type="number" name="radius_m" value="{{ geofence.radius_m }}" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Save changes</button>
    </form>
</div>
{% endblock %}
