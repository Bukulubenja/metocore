<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>You're offline — Metocore</title>
    <link rel="icon" type="image/png" href="/static/img/favicon.png">
    <link rel="stylesheet" href="/static/css/main.css">
</head>
<body>
    <div class="app-shell">
        <main class="app-main">
            <div class="hero-band">
                <span class="hero-band__logo"><img src="/static/img/logo-full.png" alt="Metocore"></span>
                <h1>You're offline</h1>
                <p>Check your connection and try again.</p>
            </div>
            <div class="card" style="max-width: 420px; margin: -1.5rem auto 0; text-align: center;">
                <button type="button" class="btn btn-primary btn-block" onclick="location.reload()">Try again</button>
            </div>
        </main>
    </div>
</body>
</html>
